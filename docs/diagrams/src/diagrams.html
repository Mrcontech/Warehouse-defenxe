<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EBSU DW diagrams</title>
<!--
  Source for the design diagrams in the project report and slides.
  Render to PNG with:  node docs/diagrams/src/render.mjs   (needs Playwright)
  Every diagram is drawn from the declarations at the bottom of this file.
-->
<style>
  @font-face { font-family: "Geist"; src: url("../../../node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("../../../node_modules/geist/dist/fonts/geist-mono/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  :root { --ink: #1f1d1b; --ink2: #46423e; --muted: #6f6a64; --line: #8f877e; --soft: #f6f3ef; --card: #ffffff; --accent: #d9443e; --accentSoft: #fbe7e5; --accentInk: #b5302c; --night: #211f1d; }
  body { margin: 0; background: #ffffff; font-family: "Geist", system-ui, sans-serif; color: var(--ink); }
  .fig { display: inline-block; padding: 18px; background: #ffffff; }
  svg text { font-family: "Geist", system-ui, sans-serif; }
  .mono { font-family: "Geist Mono", monospace; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const NS = "http://www.w3.org/2000/svg";
const C = { ink: "#1f1d1b", ink2: "#46423e", muted: "#6f6a64", line: "#8f877e", soft: "#f6f3ef", card: "#ffffff", accent: "#d9443e", accentSoft: "#fbe7e5", accentInk: "#b5302c", night: "#211f1d", border: "#cfc7be" };

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function textBlock(g, x, y, lines, { size = 14, weight = 500, fill = C.ink, anchor = "middle", lh = 1.25, mono = false } = {}) {
  const arr = Array.isArray(lines) ? lines : String(lines).split("\n");
  const total = (arr.length - 1) * size * lh;
  arr.forEach((ln, i) => {
    const t = el("text", { x, y: y - total / 2 + i * size * lh + size * 0.35, "font-size": size, "font-weight": weight, fill, "text-anchor": anchor }, g);
    if (mono) t.setAttribute("class", "mono");
    t.textContent = ln;
  });
}

function anchor(n, side) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  if (typeof side === "object") return side;
  switch (side) {
    case "t": return { x: cx, y: n.y };
    case "b": return { x: cx, y: n.y + n.h };
    case "l": return { x: n.x, y: cy };
    case "r": return { x: n.x + n.w, y: cy };
    case "tl": return { x: n.x + n.w * 0.25, y: n.y };
    case "tr": return { x: n.x + n.w * 0.75, y: n.y };
    case "bl": return { x: n.x + n.w * 0.25, y: n.y + n.h };
    case "br": return { x: n.x + n.w * 0.75, y: n.y + n.h };
    case "lt": return { x: n.x, y: n.y + n.h * 0.3 };
    case "lb": return { x: n.x, y: n.y + n.h * 0.7 };
    case "rt": return { x: n.x + n.w, y: n.y + n.h * 0.3 };
    case "rb": return { x: n.x + n.w, y: n.y + n.h * 0.7 };
    default: return { x: cx, y: cy };
  }
}

function drawNode(svg, n) {
  const g = el("g", {}, svg);
  const { x, y, w, h } = n;
  const tone = n.tone || "plain";
  const fill = tone === "accent" ? C.accent : tone === "dark" ? C.night : tone === "soft" ? C.soft : tone === "warn" ? C.accentSoft : C.card;
  const stroke = tone === "accent" ? C.accent : tone === "dark" ? C.night : tone === "warn" ? C.accent : C.border;
  const txt = tone === "accent" || tone === "dark" ? "#fff8f5" : C.ink;
  switch (n.shape) {
    case "ellipse":
      el("ellipse", { cx: x + w / 2, cy: y + h / 2, rx: w / 2, ry: h / 2, fill, stroke, "stroke-width": 1.5 }, g);
      textBlock(g, x + w / 2, y + h / 2, n.text, { size: n.size || 14, fill: txt });
      break;
    case "oval":
      el("rect", { x, y, width: w, height: h, rx: h / 2, fill: n.tone ? fill : C.night, stroke: n.tone ? stroke : C.night, "stroke-width": 1.5 }, g);
      textBlock(g, x + w / 2, y + h / 2, n.text, { size: n.size || 14, fill: n.tone ? txt : "#fff8f5", weight: 600 });
      break;
    case "diamond": {
      const cx = x + w / 2, cy = y + h / 2;
      el("polygon", { points: `${cx},${y} ${x + w},${cy} ${cx},${y + h} ${x},${cy}`, fill: C.accentSoft, stroke: C.accent, "stroke-width": 1.5 }, g);
      textBlock(g, cx, cy, n.text, { size: n.size || 13, fill: C.ink });
      break;
    }
    case "circle":
      el("circle", { cx: x + w / 2, cy: y + h / 2, r: w / 2, fill, stroke, "stroke-width": 2 }, g);
      textBlock(g, x + w / 2, y + h / 2, n.text, { size: n.size || 15, fill: txt, weight: 600 });
      break;
    case "entity":
      el("rect", { x, y, width: w, height: h, rx: 4, fill: C.night, stroke: C.night }, g);
      textBlock(g, x + w / 2, y + h / 2, n.text, { size: n.size || 14, fill: "#fff8f5", weight: 600 });
      break;
    case "store": {
      // Gane-Sarson data store: open on the right, ID cell on the left
      el("rect", { x, y, width: w, height: h, fill: C.soft, stroke: "none" }, g);
      el("path", { d: `M${x + w},${y} H${x} V${y + h} H${x + w}`, fill: "none", stroke: C.ink2, "stroke-width": 1.5 }, g);
      el("line", { x1: x + 46, y1: y, x2: x + 46, y2: y + h, stroke: C.ink2, "stroke-width": 1.5 }, g);
      textBlock(g, x + 23, y + h / 2, n.id || "D", { size: 14, weight: 700, fill: C.ink });
      textBlock(g, x + 46 + (w - 46) / 2, y + h / 2, n.text, { size: n.size || 13.5, fill: C.ink });
      break;
    }
    case "process": {
      // Gane-Sarson process: rounded box with a numbered header band
      el("rect", { x, y, width: w, height: h, rx: 12, fill: C.card, stroke: C.ink2, "stroke-width": 1.5 }, g);
      el("path", { d: `M${x},${y + 28} H${x + w}`, stroke: C.ink2, "stroke-width": 1.2 }, g);
      el("path", { d: `M${x + 12},${y} H${x + w - 12} Q${x + w},${y} ${x + w},${y + 12} V${y + 28} H${x} V${y + 12} Q${x},${y} ${x + 12},${y} Z`, fill: C.accentSoft, stroke: "none" }, g);
      el("rect", { x, y, width: w, height: h, rx: 12, fill: "none", stroke: C.ink2, "stroke-width": 1.5 }, g);
      textBlock(g, x + w / 2, y + 14, n.id || "", { size: 14, weight: 700, fill: C.accentInk });
      textBlock(g, x + w / 2, y + 28 + (h - 28) / 2, n.text, { size: n.size || 13.5, fill: C.ink });
      break;
    }
    case "actor": {
      const cx = x + w / 2;
      el("circle", { cx, cy: y + 12, r: 11, fill: "none", stroke: C.ink, "stroke-width": 2 }, g);
      el("line", { x1: cx, y1: y + 23, x2: cx, y2: y + 58, stroke: C.ink, "stroke-width": 2 }, g);
      el("line", { x1: cx - 20, y1: y + 35, x2: cx + 20, y2: y + 35, stroke: C.ink, "stroke-width": 2 }, g);
      el("line", { x1: cx, y1: y + 58, x2: cx - 16, y2: y + 84, stroke: C.ink, "stroke-width": 2 }, g);
      el("line", { x1: cx, y1: y + 58, x2: cx + 16, y2: y + 84, stroke: C.ink, "stroke-width": 2 }, g);
      textBlock(g, cx, y + 104, n.text, { size: 15.5, weight: 650 });
      break;
    }
    case "label":
      textBlock(g, n.anchor === "start" ? x : n.anchor === "end" ? x + w : x + w / 2, y + h / 2, n.text, { size: n.size || 13, weight: n.weight || 500, fill: n.fill || C.muted, anchor: n.anchor || "middle" });
      break;
    default: {
      el("rect", { x, y, width: w, height: h, rx: n.rx ?? 12, fill, stroke, "stroke-width": n.dashed ? 1.6 : 1.4, "stroke-dasharray": n.dashed ? "6 5" : "" }, g);
      if (n.title) {
        textBlock(g, x + w / 2, y + 24, n.title, { size: n.titleSize || 14.5, weight: 650, fill: txt });
        textBlock(g, x + w / 2, y + 24 + (h - 24) / 2, n.text, { size: n.size || 12.5, weight: 450, fill: tone === "accent" || tone === "dark" ? "#ffe6e1" : C.muted });
      } else {
        textBlock(g, x + w / 2, y + h / 2, n.text, { size: n.size || 14, fill: txt, weight: n.weight || 500 });
      }
      if (n.tag) {
        textBlock(g, x + w / 2, y + h + 15, n.tag, { size: 13, weight: 600, fill: C.accentInk });
      }
    }
  }
}

function drawEdge(svg, nodes, e) {
  const a = anchor(nodes[e.from], e.fa || "r");
  const b = anchor(nodes[e.to], e.ta || "l");
  const pts = [a, ...(e.via || []), b];
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p.x},${p.y}`).join(" ");
  const color = e.color || C.ink2;
  el("path", { d, fill: "none", stroke: color, "stroke-width": e.width || 1.5, "stroke-dasharray": e.dashed ? "6 5" : "", "marker-end": e.arrow === false ? "" : `url(#${e.marker || "arrow"})`, "marker-start": e.both ? `url(#${e.marker || "arrow"}-start)` : "" }, svg);
  if (e.label) {
    const i = Math.max(0, Math.min(pts.length - 2, e.seg ?? Math.floor((pts.length - 1) / 2)));
    const p = pts[i], q = pts[i + 1];
    const t = e.t ?? 0.5;
    const lx = p.x + (q.x - p.x) * t + (e.dx || 0);
    const ly = p.y + (q.y - p.y) * t + (e.dy || -9);
    const lines = String(e.label).split("\n");
    const g = el("g", {}, svg);
    const size = e.labelSize || 13.5;
    const width = Math.max(...lines.map((l) => l.length)) * size * 0.52 + 12;
    const height = lines.length * size * 1.25 + 6;
    if (e.box !== false) el("rect", { x: lx - width / 2, y: ly - height / 2, width, height, rx: 5, fill: "#ffffff", opacity: 0.94 }, g);
    textBlock(g, lx, ly, lines, { size, weight: 500, fill: e.labelColor || C.ink2 });
  }
}

function defs(svg) {
  const d = el("defs", {}, svg);
  for (const [id, color] of [["arrow", C.ink2], ["accent", C.accent], ["muted", C.line]]) {
    const m = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" }, d);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: color }, m);
    const s = el("marker", { id: id + "-start", viewBox: "0 0 10 10", refX: 1, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" }, d);
    el("path", { d: "M10,0 L0,5 L10,10 z", fill: color }, s);
  }
  const open = el("marker", { id: "open", viewBox: "0 0 12 12", refX: 11, refY: 6, markerWidth: 10, markerHeight: 10, orient: "auto" }, d);
  el("path", { d: "M0,0 L11,6 L0,12", fill: "none", stroke: C.ink2, "stroke-width": 1.5 }, open);
}

function figure(id, w, h, nodes, edges, before) {
  const wrap = document.createElement("div");
  wrap.className = "fig";
  wrap.id = id;
  document.getElementById("root").appendChild(wrap);
  const svg = el("svg", { width: w, height: h, viewBox: `0 0 ${w} ${h}` });
  wrap.appendChild(svg);
  defs(svg);
  if (before) before(svg);
  const byId = {};
  for (const [k, n] of Object.entries(nodes)) byId[k] = n;
  for (const e of edges) drawEdge(svg, byId, e);
  for (const n of Object.values(nodes)) drawNode(svg, n);
}
